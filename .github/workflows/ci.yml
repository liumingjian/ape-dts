name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.svg"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE*"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.svg"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint & Static Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Use a unified cache key to allow sharing across jobs
          key: lint-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting (rustfmt)
        id: fmt
        run: cargo fmt --all --check

      - name: Run lint checks (clippy)
        id: lint
        run: cargo clippy --workspace --all-targets --all-features --exclude dt-tests -- -D warnings

      # dt-tests is still being cleaned up: lint it without `-D warnings` so a
      # compile error fails the build but style warnings only surface in the log.
      - name: Run lint checks (clippy, dt-tests transitional)
        id: lint_tests
        run: cargo clippy -p dt-tests --all-targets --all-features

      - name: Install typos-cli
        uses: taiki-e/install-action@v2
        with:
          tool: typos-cli

      - name: Check for typos
        id: typos
        run: typos

      - name: Run cargo check
        id: check
        run: cargo check --workspace --all-targets --all-features

      - name: Summarize lint issues
        if: always()
        run: |
          echo "## 🔍 Lint & Static Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status check
          if [ "${{ steps.fmt.outcome }}" == "success" ] && \
             [ "${{ steps.lint.outcome }}" == "success" ] && \
             [ "${{ steps.lint_tests.outcome }}" == "success" ] && \
             [ "${{ steps.typos.outcome }}" == "success" ] && \
             [ "${{ steps.check.outcome }}" == "success" ]; then
            echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          echo "❌ **One or more checks failed.**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Individual check results
          [ "${{ steps.fmt.outcome }}" == "failure" ] && echo "❌ **rustfmt:** Code formatting issues detected." >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.lint.outcome }}" == "failure" ] && echo "❌ **Clippy:** Code quality issues detected." >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.lint_tests.outcome }}" == "failure" ] && echo "❌ **Clippy (dt-tests):** dt-tests failed to compile." >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.typos.outcome }}" == "failure" ] && echo "❌ **typos:** Spelling issues detected." >> $GITHUB_STEP_SUMMARY
          [ "${{ steps.check.outcome }}" == "failure" ] && echo "❌ **cargo check:** Compilation errors detected." >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📋 **Next steps:** Review the logs for details and correct the identified issues." >> $GITHUB_STEP_SUMMARY

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Use a unified cache key to allow sharing across jobs
          key: test-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          # Also allow restoring from the lint cache if available
          restore-keys: |
            lint-${{ runner.os }}-

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # No `--lib --bins`: dt-console-server's tests/ suite has no external
      # dependencies and must run in CI. dt-tests is included too: without a
      # `.env` every case that needs a live database skips with a printed reason
      # (issue #50), so what runs here is its ~400 pure unit tests.
      # The `ci` profile quarantines 13 rotted tests — see .config/nextest.toml.
      - name: Run unit tests with nextest
        run: |
          cargo nextest run \
            --profile ci \
            --workspace \
            --all-features

      - name: Run doc tests
        run: cargo test --workspace --doc --all-features --exclude dt-tests

  deny:
    name: Supply Chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # Blocking: no new duplicate hyper/reqwest majors, no crates from a host
      # outside crates.io + apecloud. Both pass today.
      - name: Run cargo-deny (bans + sources)
        run: cargo deny --all-features check bans sources

      # Report-only: the pre-existing RUSTSEC backlog lives in the vendored
      # sqlx tree and mongodb 2.x. See deny.toml for why this is not blocking
      # yet and what has to happen to make it blocking.
      - name: Run cargo-deny (advisories, report-only)
        continue-on-error: true
        run: cargo deny --all-features check advisories
