# Copy this file to either:
# - `./.cc-connect/config.toml` (project-local, recommended), or
# - `~/.cc-connect/config.toml` (global)
#
# Then start cc-connect with:
# - `cc-connect -config /absolute/path/to/config.toml start`
# - or install as a daemon with `cc-connect daemon install --work-dir /path/to/dir/containing/config.toml`

language = "zh-CN" # Optional, defaults to en-US

[log]
level = "info"

[[projects]]
name = "ape-dts"

# Optional (platform-specific IDs): who can run privileged commands (e.g. /shell, /restart).
# - Not set: privileged commands disabled for everyone
# - "*": all allowed users are admins (only for personal single-user setups)
# admin_from = "*"

[projects.agent]
# Supported: claudecode, codex, cursor, gemini, qoder, opencode, iflow
type = "codex"

[projects.agent.options]
work_dir = "/Users/lmj/projects/ai-project/ape-dts"
# Codex mode: suggest (default), auto-edit, full-auto, yolo
mode = "suggest"
# model = "o3" # Optional

#
# Platforms
# Pick one (or more) sections below and fill in the credentials.
#

# --- Feishu / Lark ---
# If cc-connect is installed, you can also run:
# `cc-connect feishu setup --project ape-dts`
#
# [[projects.platforms]]
# type = "feishu"
# [projects.platforms.options]
# app_id = "cli_xxx"
# app_secret = "sec_xxx"
# allow_from = "*" # Optional: restrict which users can interact

# --- DingTalk ---
# [[projects.platforms]]
# type = "dingtalk"
# [projects.platforms.options]
# client_id = "dingxxxxxxxxxxxxxxx"
# client_secret = "xxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# --- WeCom (WeChat Work) - WebSocket (recommended) ---
# [[projects.platforms]]
# type = "wecom"
# [projects.platforms.options]
# mode = "websocket"
# bot_id = "your-bot-id"
# bot_secret = "your-bot-secret"
# allow_from = "*"

# --- Weixin personal (ilink) ---
# Requires `cc-connect@beta` to use `cc-connect weixin setup`.
# [[projects.platforms]]
# type = "weixin"
# [projects.platforms.options]
# token = "ilink_bot_bearer_token"
# # base_url = "https://ilinkai.weixin.qq.com"
# # cdn_base_url = "https://novac2c.cdn.weixin.qq.com/c2c"
# allow_from = "*" # Recommended: restrict allowed users in production
# # account_id = "default"
# # route_tag = ""
# # long_poll_timeout_ms = 35000
# # proxy = ""

# --- Telegram ---
# [[projects.platforms]]
# type = "telegram"
# [projects.platforms.options]
# token = "1234567890:ABCdefGHIjklMNOpqrsTUVwxyz-123456"
# # allow_from = "123456789" # Optional: Telegram user IDs (comma-separated)
#
# Note: `admin_from` belongs to the project (above), not inside platform options.

# --- QQ (OneBot v11, e.g. NapCat) ---
# [[projects.platforms]]
# type = "qq"
# [projects.platforms.options]
# ws_url = "ws://127.0.0.1:3001"
# token = "" # Optional: OneBot access token
# allow_from = "*" # QQ numbers, comma-separated, or "*"
