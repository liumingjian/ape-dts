# cargo-nextest configuration.

[profile.default]
# dt-console-server's tests/ suite spawns real processes and sqlite files;
# 60s is not enough headroom for the precheck-backed cases on a cold runner.
slow-timeout = { period = "60s", terminate-after = 5 }

# CI profile — used by .github/workflows/ci.yml.
[profile.ci]
fail-fast = false

# ── Quarantine: rotted dt-console-server integration tests ───────────────
#
# These 13 tests never ran in CI (the nextest invocation used to pass
# `--lib --bins`), so they rotted against the code they cover. Issue #33
# turned the suite on; issue #87 fixes these and DELETES this filter.
#
# Two root causes, both real, neither fixable inside a CI-stabilisation
# batch — see #87:
#   * run_lifecycle (11): `POST /api/tasks/{id}/start` now runs a precheck
#     first, and the fixtures point at unresolvable hosts → 422.
#   * task_crud_validation_rg (2): the validator rejects `mysql://` for
#     GaussDB's mysql/oracle compat modes → 422. Domain question.
#
# Everything else in the suite runs. Do not add to this list without a
# ticket — a quarantine that grows silently is worse than no suite at all.
default-filter = """
    not (
        binary(run_lifecycle) and (
            test(=test_concurrent_start_task_race_only_one_succeeds)
            + test(=test_control_log_start_intent_then_result_in_order)
            + test(=test_control_log_stop_intent_and_result)
            + test(=test_control_logs_written_on_start_and_stop)
            + test(=test_get_control_logs_ordered_by_ts_desc_with_filters)
            + test(=test_get_run_returns_details)
            + test(=test_rg_reassignment_blocked_during_active_run)
            + test(=test_run_position_null_when_missing)
            + test(=test_sequential_runs_produce_isolated_cwds)
            + test(=test_start_already_running_returns_409)
            + test(=test_start_task_returns_202_with_run_id)
        )
    )
    and not (
        binary(task_crud_validation_rg) and (
            test(=gaussdb_mysql_mode_201) + test(=gaussdb_oracle_mode_201)
        )
    )
"""
