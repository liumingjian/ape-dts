[extractor]
db_type=gaussdb_oracle
extract_type=cdc
url={gaussdb_oracle_sinker_without_auth_url}
username={gaussdb_oracle_sinker_username}
password={gaussdb_oracle_sinker_password}
slot_name=ape_test_gaussdb_oracle_precheck
start_lsn=
recreate_slot_if_exists=false
keepalive_interval_secs=10
heartbeat_interval_secs=0
heartbeat_tb=heartbeat_db.ape_dts_heartbeat
start_time_utc=
end_time_utc=

[filter]
do_dbs=
ignore_dbs=
do_tbs=public.gaussdb_oracle_to_pg_precheck_basic
ignore_tbs=
do_events=

[sinker]
db_type=pg
sink_type=write
url={pg_sinker_without_auth_url}
username={pg_sinker_username}
password={pg_sinker_password}
batch_size=2

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=rdb_merge
parallel_size=1

[pipeline]
checkpoint_interval_secs=1
buffer_size=1

[runtime]
log_level=info
log_dir=./logs
log4rs_file=./log4rs.yaml

[precheck]
do_struct_init=true
do_cdc=true

