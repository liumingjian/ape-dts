[extractor]
extract_type=struct
db_type=gaussdb_oracle
url={gaussdb_oracle_sinker_without_auth_url}
username={gaussdb_oracle_sinker_username}
password={gaussdb_oracle_sinker_password}

[sinker]
sink_type=struct
db_type=pg
url={pg_sinker_without_auth_url}
username={pg_sinker_username}
password={pg_sinker_password}
batch_size=1
conflict_policy=interrupt

[filter]
do_dbs=
ignore_dbs=
do_tbs=public.gaussdb_oracle_to_pg_struct_basic
ignore_tbs=
do_events=
do_structures=database,table,constraint,sequence,comment,index

[router]
db_map=
tb_map=
col_map=

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
checkpoint_interval_secs=1
buffer_size=100

