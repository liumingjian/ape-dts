[extractor]
extract_type=struct
db_type=pg
url={pg_extractor_without_auth_url}
username={pg_extractor_username}
password={pg_extractor_password}

[sinker]
sink_type=struct
db_type=gaussdb_pg
url={gaussdb_pg_sinker_without_auth_url}
username={gaussdb_pg_sinker_username}
password={gaussdb_pg_sinker_password}
batch_size=1
conflict_policy=interrupt

[filter]
do_dbs=
ignore_dbs=
do_tbs=public.gaussdb_struct_vr_base,public.gaussdb_struct_vr_view,public.gaussdb_struct_vr_matview,public.gaussdb_struct_vr_func,public.gaussdb_struct_vr_proc
ignore_tbs=
do_events=
do_structures=database,table,constraint,sequence,comment,index,routine,view

[router]
db_map=
tb_map=
col_map=

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
checkpoint_interval_secs=1
buffer_size=100
