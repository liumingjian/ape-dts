[extractor]
db_type=gaussdb_oracle
extract_type=cdc
url={gaussdb_oracle_sinker_without_auth_url}
username={gaussdb_oracle_sinker_username}
password={gaussdb_oracle_sinker_password}
slot_name=ape_test_gaussdb_oracle
start_lsn=
; GaussDB HA clusters can be unstable when repeatedly dropping/creating logical slots.
; Prefer reusing an existing slot for test retries to reduce pressure on the source.
recreate_slot_if_exists=false
keepalive_interval_secs=10
heartbeat_interval_secs=0
heartbeat_tb=heartbeat_db.ape_dts_heartbeat
start_time_utc=
end_time_utc=

[filter]
do_dbs=
ignore_dbs=
do_tbs=public.gdbo_ora_cdc_basic
ignore_tbs=
do_events=insert,update,delete

[sinker]
db_type=oracle
sink_type=write
url={oracle_sinker_without_auth_url}
username={oracle_sinker_username}
password={oracle_sinker_password}
batch_size=2

[router]
db_map=public:APE_DTS
tb_map=public.gdbo_ora_cdc_basic:APE_DTS.GDBO_ORA_CDC_BASIC
col_map=json:[{"db":"public","tb":"gdbo_ora_cdc_basic","col_map":{"id":"ID","val":"VAL"}}]

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
