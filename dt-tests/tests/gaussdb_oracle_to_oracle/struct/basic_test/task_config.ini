[extractor]
db_type=gaussdb_oracle
extract_type=struct
url={gaussdb_oracle_sinker_without_auth_url}
username={gaussdb_oracle_sinker_username}
password={gaussdb_oracle_sinker_password}

[sinker]
db_type=oracle
sink_type=struct
url={oracle_sinker_without_auth_url}
username={oracle_sinker_username}
password={oracle_sinker_password}
batch_size=1
conflict_policy=interrupt

[filter]
do_dbs=
ignore_dbs=
do_tbs=public.gdbo_ora_struct_basic
ignore_tbs=
do_events=
do_structures=table,constraint

[router]
db_map=public:APE_DTS
tb_map=public.gdbo_ora_struct_basic:APE_DTS.GDBO_ORA_STRUCT_BASIC
col_map=json:[{"db":"public","tb":"gdbo_ora_struct_basic","col_map":{"id":"ID","val":"VAL"}}]

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
checkpoint_interval_secs=1
buffer_size=100

