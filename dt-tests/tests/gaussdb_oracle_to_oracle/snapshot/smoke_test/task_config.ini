[extractor]
db_type=gaussdb_oracle
extract_type=snapshot
url={gaussdb_oracle_sinker_without_auth_url}
username={gaussdb_oracle_sinker_username}
password={gaussdb_oracle_sinker_password}

[sinker]
db_type=oracle
sink_type=write
url={oracle_sinker_without_auth_url}
username={oracle_sinker_username}
password={oracle_sinker_password}
batch_size=2

[filter]
do_dbs=
ignore_dbs=
do_tbs=public.gdbo_ora_snap_smoke
ignore_tbs=
do_events=insert

[router]
db_map=public:APE_DTS
tb_map=public.gdbo_ora_snap_smoke:APE_DTS.GDBO_ORA_SNAP_SMOKE
col_map=json:[{"db":"public","tb":"gdbo_ora_snap_smoke","col_map":{"id":"ID","val":"VAL"}}]

[parallelizer]
parallel_type=snapshot
parallel_size=1

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

