[extractor]
db_type=gaussdb_pg
extract_type=cdc
url={gaussdb_pg_extractor_without_auth_url}
username={gaussdb_pg_extractor_username}
password={gaussdb_pg_extractor_password}
slot_name=ape_test_gaussdb_resume
start_lsn=
recreate_slot_if_exists=false
keepalive_interval_secs=10
heartbeat_interval_secs=0
heartbeat_tb=heartbeat_db.ape_dts_heartbeat
start_time_utc=
end_time_utc=

[filter]
do_dbs=
ignore_dbs=
do_tbs=public.gaussdb_cdc_resume
ignore_tbs=
do_events=insert,update,delete

[sinker]
db_type=pg
sink_type=write
url={pg_sinker_without_auth_url}
username={pg_sinker_username}
password={pg_sinker_password}
batch_size=2

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=rdb_merge
parallel_size=1

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
; Use a unique, stable log_dir for resume tests to avoid cross-test interference.
log_dir=./tmp/gaussdb_to_pg/cdc/resume_test/logs

[resumer]
resume_type=from_log
log_dir=./tmp/gaussdb_to_pg/cdc/resume_test/logs
config_file=./tmp/gaussdb_to_pg/cdc/resume_test/logs/position.log

