[extractor]
db_type=pg
extract_type=cdc
url={pg_extractor_without_auth_url}
username={pg_extractor_username}
password={pg_extractor_password}
slot_name=ape_test_pg_to_gaussdb_oracle
pub_name=
start_lsn=
recreate_slot_if_exists=true
keepalive_interval_secs=10
heartbeat_interval_secs=0
heartbeat_tb=heartbeat_db.ape_dts_heartbeat
start_time_utc=
end_time_utc=

[filter]
do_dbs=
ignore_dbs=
do_tbs=public.pg_to_gaussdb_oracle_cdc_basic
ignore_tbs=
do_events=insert,update,delete

[sinker]
db_type=gaussdb_oracle
sink_type=write
url={gaussdb_oracle_sinker_without_auth_url}
username={gaussdb_oracle_sinker_username}
password={gaussdb_oracle_sinker_password}
batch_size=2

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=rdb_merge
parallel_size=1

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

