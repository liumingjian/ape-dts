[extractor]
extract_type=struct
db_type=mysql
url={mysql_extractor_url_8_0}

[sinker]
sink_type=struct
db_type=gaussdb_mysql
batch_size=1
url={gaussdb_mysql_sinker_without_auth_url}
username={gaussdb_mysql_sinker_username}
password={gaussdb_mysql_sinker_password}
conflict_policy=interrupt

[filter]
do_dbs=gaussdb_mysql_struct_basic
ignore_dbs=
do_tbs=
ignore_tbs=
do_events=
do_structures=database,table,constraint,index,comment

[router]
db_map=
tb_map=
col_map=

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
checkpoint_interval_secs=1
buffer_size=100
