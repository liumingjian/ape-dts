[extractor]
db_type=mysql
extract_type=snapshot
url={mysql_extractor_without_auth_url}
username={mysql_extractor_username}
password={mysql_extractor_password}
batch_size=100
max_connections=4

[sinker]
db_type=gaussdb_mysql
sink_type=write
url={gaussdb_mysql_sinker_without_auth_url}
username={gaussdb_mysql_sinker_username}
password={gaussdb_mysql_sinker_password}
batch_size=50
replace=false
max_connections=4
disable_foreign_key_checks=true

[filter]
do_dbs=
ignore_dbs=
do_tbs=gaussdb_mysql_smoke.*
ignore_tbs=
do_events=insert

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=snapshot
parallel_size=1

[pipeline]
buffer_size=100
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
