[extractor]
db_type=mysql
extract_type=snapshot
url={mysql_extractor_url_8_0}

[sinker]
db_type=gaussdb_mysql
sink_type=check
url={gaussdb_mysql_sinker_without_auth_url}
username={gaussdb_mysql_sinker_username}
password={gaussdb_mysql_sinker_password}
batch_size=2

[filter]
do_dbs=
ignore_dbs=
do_tbs=gaussdb_mysql_check_basic.*
ignore_tbs=
do_events=insert

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=rdb_check
parallel_size=1

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
