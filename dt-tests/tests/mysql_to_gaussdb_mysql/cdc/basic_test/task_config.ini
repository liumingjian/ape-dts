[extractor]
db_type=mysql
extract_type=cdc
binlog_position=0
binlog_filename=
server_id=2100
url={mysql_extractor_without_auth_url}
username={mysql_extractor_username}
password={mysql_extractor_password}
heartbeat_interval_secs=1
heartbeat_tb=heartbeat_db.ape_dts_heartbeat

[filter]
do_dbs=
ignore_dbs=
do_tbs=gaussdb_mysql_cdc_basic.*
ignore_tbs=
do_events=insert,update,delete
do_ddls=

[sinker]
db_type=gaussdb_mysql
sink_type=write
batch_size=2
url={gaussdb_mysql_sinker_without_auth_url}
username={gaussdb_mysql_sinker_username}
password={gaussdb_mysql_sinker_password}
replace=false
max_connections=4
disable_foreign_key_checks=true

[router]
tb_map=
col_map=
db_map=

[parallelizer]
parallel_type=rdb_merge
parallel_size=1

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_dir=./logs
log_level=info
log4rs_file=./log4rs.yaml
