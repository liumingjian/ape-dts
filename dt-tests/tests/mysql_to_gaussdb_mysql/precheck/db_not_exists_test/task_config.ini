[extractor]
db_type=mysql
extract_type=cdc
binlog_position=0
binlog_filename=
server_id=2001
url={mysql_extractor_without_auth_url}
username={mysql_extractor_username}
password={mysql_extractor_password}

[sinker]
db_type=gaussdb_mysql
sink_type=write
batch_size=2
url={gaussdb_mysql_sinker_without_auth_url}
username={gaussdb_mysql_sinker_username}
password={gaussdb_mysql_sinker_password}

[filter]
do_dbs=
ignore_dbs=
do_tbs=gaussdb_mysql_precheck_missing.table_test
ignore_tbs=
do_events=

[router]
db_map=
tb_map=
col_map=

[runtime]
log_level=info
log_dir=./logs
log4rs_file=./log4rs.yaml

[parallelizer]
parallel_type=rdb_merge
parallel_size=1

[pipeline]
checkpoint_interval_secs=1
buffer_size=1

[precheck]
do_struct_init=true
do_cdc=true
