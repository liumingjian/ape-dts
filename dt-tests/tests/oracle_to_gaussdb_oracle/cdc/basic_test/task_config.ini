[extractor]
db_type=oracle
extract_type=cdc
url={oracle_extractor_without_auth_url}
username={oracle_extractor_username}
password={oracle_extractor_password}
poll_interval_millis=200
poll_batch_size=200
start_change_id=0
start_time_utc=
end_time_utc=

[filter]
do_dbs=
ignore_dbs=
do_tbs=APE_DTS.ORA_GDBO_CDC_BASIC
ignore_tbs=
do_events=insert,update,delete

[sinker]
db_type=gaussdb_oracle
sink_type=write
url={gaussdb_oracle_sinker_without_auth_url}
username={gaussdb_oracle_sinker_username}
password={gaussdb_oracle_sinker_password}
batch_size=2

[router]
db_map=APE_DTS:public
tb_map=APE_DTS.ORA_GDBO_CDC_BASIC:public.ora_gdbo_cdc_basic
col_map=json:[{"db":"APE_DTS","tb":"ORA_GDBO_CDC_BASIC","col_map":{"ID":"id","VAL":"val"}}]

[parallelizer]
parallel_type=rdb_merge
parallel_size=1

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

