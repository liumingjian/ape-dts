[extractor]
extract_type=struct
db_type=oracle
url={oracle_extractor_without_auth_url}
username={oracle_extractor_username}
password={oracle_extractor_password}

[sinker]
sink_type=struct
db_type=gaussdb_oracle
url={gaussdb_oracle_sinker_without_auth_url}
username={gaussdb_oracle_sinker_username}
password={gaussdb_oracle_sinker_password}
batch_size=1
conflict_policy=interrupt

[filter]
do_dbs=
ignore_dbs=
do_tbs=APE_DTS.ORA_GDBO_STRUCT_BASIC
ignore_tbs=
do_events=
do_structures=database,table,constraint

[router]
db_map=APE_DTS:public
tb_map=APE_DTS.ORA_GDBO_STRUCT_BASIC:public.ora_gdbo_struct_basic
col_map=json:[{"db":"APE_DTS","tb":"ORA_GDBO_STRUCT_BASIC","col_map":{"ID":"id","VAL":"val"}}]

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
checkpoint_interval_secs=1
buffer_size=100

