[extractor]
db_type=oracle
extract_type=snapshot
url={oracle_extractor_without_auth_url}
username={oracle_extractor_username}
password={oracle_extractor_password}

[sinker]
db_type=gaussdb_oracle
sink_type=write
url={gaussdb_oracle_sinker_without_auth_url}
username={gaussdb_oracle_sinker_username}
password={gaussdb_oracle_sinker_password}
batch_size=2

[filter]
do_dbs=
ignore_dbs=
do_tbs=APE_DTS.ORA_GDBO_SNAP_SMOKE
ignore_tbs=
do_events=insert

[router]
db_map=APE_DTS:public
tb_map=APE_DTS.ORA_GDBO_SNAP_SMOKE:public.ora_gdbo_snap_smoke
col_map=json:[{"db":"APE_DTS","tb":"ORA_GDBO_SNAP_SMOKE","col_map":{"ID":"id","VAL":"val"}}]

[parallelizer]
parallel_type=snapshot
parallel_size=1

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
