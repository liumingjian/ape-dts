[extractor]
db_type=oracle
extract_type=cdc
url={oracle_extractor_without_auth_url}
username={oracle_extractor_username}
password={oracle_extractor_password}
poll_interval_millis=200
poll_batch_size=200
start_change_id=0
start_time_utc=
end_time_utc=

[filter]
do_dbs=
ignore_dbs=
do_tbs=APE_DTS.ORA_GDBO_PRECHECK_BASIC
ignore_tbs=
do_events=

[sinker]
db_type=gaussdb_oracle
sink_type=write
url={gaussdb_oracle_sinker_without_auth_url}
username={gaussdb_oracle_sinker_username}
password={gaussdb_oracle_sinker_password}
batch_size=2

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=rdb_merge
parallel_size=1

[pipeline]
checkpoint_interval_secs=1
buffer_size=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[precheck]
do_struct_init=false
do_cdc=true
