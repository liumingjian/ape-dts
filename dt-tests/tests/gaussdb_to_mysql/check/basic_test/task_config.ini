[extractor]
db_type=gaussdb_pg
extract_type=snapshot
url={gaussdb_pg_extractor_without_auth_url}
username={gaussdb_pg_extractor_username}
password={gaussdb_pg_extractor_password}

[sinker]
db_type=mysql
sink_type=check
url={mysql_sinker_without_auth_url}
username={mysql_sinker_username}
password={mysql_sinker_password}
batch_size=2
transaction_isolation=read_committed
disable_foreign_key_checks=true

[filter]
do_dbs=
ignore_dbs=
do_tbs=public.gaussdb_to_mysql_check_basic
ignore_tbs=
do_events=insert

[router]
db_map=public:gaussdb_to_mysql_check_dst
tb_map=
col_map=

[parallelizer]
parallel_type=rdb_check
parallel_size=1

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
