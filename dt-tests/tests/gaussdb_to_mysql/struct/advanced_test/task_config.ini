[extractor]
db_type=gaussdb_pg
extract_type=struct
url={gaussdb_pg_extractor_without_auth_url}
username={gaussdb_pg_extractor_username}
password={gaussdb_pg_extractor_password}
db_batch_size=1

[sinker]
db_type=mysql
sink_type=struct
batch_size=1
url={mysql_sinker_without_auth_url}
username={mysql_sinker_username}
password={mysql_sinker_password}
conflict_policy=interrupt

[filter]
do_dbs=
ignore_dbs=
do_tbs=public.gaussdb_to_mysql_struct_advanced
ignore_tbs=
do_events=
do_structures=database,table,index

[router]
db_map=public:gaussdb_to_mysql_struct_adv_dst
tb_map=
col_map=

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
checkpoint_interval_secs=1
buffer_size=100

