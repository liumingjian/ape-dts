[extractor]
db_type=gaussdb_pg
extract_type=cdc
url={gaussdb_pg_extractor_without_auth_url}
username={gaussdb_pg_extractor_username}
password={gaussdb_pg_extractor_password}
slot_name=ape_test_gaussdb
start_lsn=
; GaussDB HA clusters can be unstable when repeatedly dropping/creating logical slots.
; Prefer reusing an existing slot for test retries to reduce pressure on the source.
recreate_slot_if_exists=false
keepalive_interval_secs=10
heartbeat_interval_secs=0
heartbeat_tb=heartbeat_db.ape_dts_heartbeat
start_time_utc=
end_time_utc=

[filter]
do_dbs=
ignore_dbs=
do_tbs=public.gaussdb_to_mysql_cdc_basic
ignore_tbs=
do_events=insert,update,delete

[sinker]
db_type=mysql
sink_type=write
url={mysql_sinker_without_auth_url}
username={mysql_sinker_username}
password={mysql_sinker_password}
batch_size=2
transaction_isolation=read_committed
disable_foreign_key_checks=true

[router]
db_map=public:gaussdb_to_mysql_cdc_dst
tb_map=
col_map=

[parallelizer]
parallel_type=rdb_merge
parallel_size=1

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
