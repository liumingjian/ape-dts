[global]
task_id=snapshot_mysql_mysql_abcd1234

[extractor]
db_type=mysql
extract_type=snapshot
url=mysql://src:3307/db
username=root
password=src_pass

[sinker]
db_type=mysql
sink_type=write
url=mysql://dst:3308/db
username=root
password=dst_pass
batch_size=2
replace=true
disable_foreign_key_checks=true
transaction_isolation=read_committed

[filter]
do_tbs=test_db_1.*
do_events=insert
do_dbs=
ignore_dbs=
ignore_tbs=

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=snapshot
parallel_size=2

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
