[global]
task_id=cdc_gaussdb_mysql_mysql_abcd1234

[extractor]
db_type=gaussdb_mysql
extract_type=cdc
url=mysql://gaussdb:3311/db
username=root
password=gaussdb_pass
server_id=2000
heartbeat_interval_secs=1
heartbeat_tb=heartbeat_db.ape_dts_heartbeat

[sinker]
db_type=mysql
sink_type=write
url=mysql://dst:3308/db
username=root
password=dst_pass
batch_size=2
replace=true
disable_foreign_key_checks=true

[filter]
do_tbs=public.gaussdb_to_mysql_cdc_basic
do_events=insert,update,delete
do_dbs=
ignore_dbs=
ignore_tbs=

[router]
db_map=public:gaussdb_to_mysql_cdc_dst
tb_map=
col_map=

[parallelizer]
parallel_type=rdb_merge
parallel_size=1

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[metrics]
http_port=9100
http_host=0.0.0.0
workers=2
