[global]
task_id=cdc_pg_pg_abcd1234

[extractor]
db_type=pg
extract_type=cdc
url=postgres://src:5433/db
username=root
password=src_pass
heartbeat_interval_secs=10
heartbeat_tb=heartbeat_db.ape_dts_heartbeat
slot_name=ape_test
recreate_slot_if_exists=true

[sinker]
db_type=pg
sink_type=write
url=postgres://dst:5434/db
username=root
password=dst_pass
batch_size=2

[filter]
do_dbs=upper_case_db
do_tbs=public.default_table
do_events=insert,update,delete
ignore_dbs=
ignore_tbs=

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=rdb_merge
parallel_size=2

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
