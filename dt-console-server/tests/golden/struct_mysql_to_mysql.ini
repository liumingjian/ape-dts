[global]
task_id=struct_mysql_mysql_abcd1234

[extractor]
db_type=mysql
extract_type=struct
url=mysql://src:3307/db

[sinker]
db_type=mysql
sink_type=struct
url=mysql://dst:3308/db
conflict_policy=interrupt

[filter]
do_dbs=struct_it_mysql2mysql_1
do_structures=table,index,constraint
ignore_dbs=
do_tbs=
ignore_tbs=

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
buffer_size=100
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[metrics]
http_port=9100
http_host=0.0.0.0
workers=2
