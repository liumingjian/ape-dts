[global]
task_id=cdc_mysql_mysql_abcd1234

[extractor]
db_type=mysql
extract_type=cdc
url=mysql://src:3307/db
username=root
password=src_pass
binlog_position=0
server_id=2000
heartbeat_interval_secs=1
heartbeat_tb=heartbeat_db.ape_dts_heartbeat

[sinker]
db_type=mysql
sink_type=write
url=mysql://dst:3308/db
username=root
password=dst_pass
batch_size=2

[filter]
do_tbs=test_db_1.*,upper_case_db.*
do_events=insert,update,delete
do_ddls=*
do_dbs=
ignore_dbs=
ignore_tbs=

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=rdb_merge
parallel_size=2

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
