[global]
task_id=snapshot_mysql_kafka_abcd1234

[extractor]
db_type=mysql
extract_type=snapshot
url=mysql://src:3307/db

[sinker]
db_type=kafka
sink_type=write
url=kafka://kafka:9092
batch_size=2

[filter]
do_tbs=test_db_1.*,test_db_2.*
do_events=insert,update,delete
do_dbs=
ignore_dbs=
ignore_tbs=

[router]
topic_map=*.*:test,test_db_1.*:test2
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
buffer_size=16000
checkpoint_interval_secs=15

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs
