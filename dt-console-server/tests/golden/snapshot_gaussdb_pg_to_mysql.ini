[global]
task_id=snapshot_gaussdb_pg_mysql_abcd1234

[extractor]
db_type=gaussdb_pg
extract_type=snapshot
url=postgres://gaussdb:8000/db
username=root
password=gaussdb_pass

[sinker]
db_type=mysql
sink_type=write
url=mysql://dst:3308/db
username=root
password=dst_pass
batch_size=2
replace=true
disable_foreign_key_checks=true

[filter]
do_tbs=public.gaussdb_to_pg_snapshot_basic
do_events=insert
do_dbs=
ignore_dbs=
ignore_tbs=

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=snapshot
parallel_size=1

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[metrics]
http_port=9100
http_host=0.0.0.0
workers=2
