[global]
task_id=cdc_oracle_oracle_abcd1234

[extractor]
db_type=oracle
extract_type=cdc
url=oracle://src:1521/db
username=system
password=oracle
cdc_mode=logminer
poll_interval_millis=200
poll_batch_size=200
start_scn=0

[sinker]
db_type=oracle
sink_type=write
url=oracle://dst:1521/db
username=system
password=oracle
batch_size=2

[filter]
do_tbs=APE_DTS.ORA_CDC_BASIC
do_events=insert,update,delete
do_dbs=
ignore_dbs=
ignore_tbs=

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=serial
parallel_size=1

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[metrics]
http_port=9100
http_host=0.0.0.0
workers=2
