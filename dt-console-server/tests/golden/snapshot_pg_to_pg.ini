[global]
task_id=snapshot_pg_pg_abcd1234

[extractor]
db_type=pg
extract_type=snapshot
url=postgres://src:5433/db
username=root
password=src_pass

[sinker]
db_type=pg
sink_type=write
url=postgres://dst:5434/db
username=root
password=dst_pass
batch_size=2
replace=true
disable_foreign_key_checks=true

[filter]
do_dbs=test_db_1
do_events=insert
ignore_dbs=
do_tbs=
ignore_tbs=

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=snapshot
parallel_size=2

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[metrics]
http_port=9100
http_host=0.0.0.0
workers=2
