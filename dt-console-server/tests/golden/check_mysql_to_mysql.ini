[global]
task_id=check_mysql_mysql_abcd1234

[extractor]
db_type=mysql
extract_type=snapshot
url=mysql://src:3307/db

[sinker]
db_type=mysql
sink_type=check
url=mysql://dst:3308/db
batch_size=2
check_log_dir=./check

[filter]
do_tbs=test_db_1.*
do_events=insert
do_dbs=
ignore_dbs=
ignore_tbs=

[router]
db_map=
tb_map=
col_map=

[parallelizer]
parallel_type=rdb_check
parallel_size=2

[pipeline]
buffer_size=4
checkpoint_interval_secs=1

[runtime]
log_level=info
log4rs_file=./log4rs.yaml
log_dir=./logs

[metrics]
http_port=9100
http_host=0.0.0.0
workers=2
